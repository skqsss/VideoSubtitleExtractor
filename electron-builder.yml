# 桌面端打包配置：只产出 NSIS 安装包
# 需要免安装单文件时用 npm run build:win:portable（命令行覆盖目标列表，不用改本文件）
appId: com.local.video-fetch
productName: 视频分辨率解析下载器
copyright: 仅供个人在已获授权的范围内使用

directories:
  output: release
  buildResources: build

# 直接复用 node_modules 里已下载好的 Electron 发行版：
# 本机解压后重命名临时目录会被杀软/索引占用导致 EPERM，走这条路可以完全跳过下载解包
electronDist: node_modules/electron/dist

# 应用代码 + 生产依赖；electron-builder 会自动剔除 devDependencies
files:
  - dist/**
  - dist-electron/**
  # 冒烟自检入口只在开发期用（npm run test:electron），不打进成品
  - '!dist-electron/smoke.mjs'
  - package.json
  - node_modules/**

# yt-dlp 与 ffmpeg 随包分发：asar 是只读归档，运行时由主进程复制到 userData 再执行
extraResources:
  - from: bin
    to: bin
    filter:
      - '**/*'

asar: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 视频分辨率解析下载器
  deleteAppDataOnUninstall: false
